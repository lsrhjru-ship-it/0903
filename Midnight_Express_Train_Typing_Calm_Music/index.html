<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Midnight Express - 전국 지하철역 타자게임</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><canvas id="gameCanvas"></canvas>
<div id="startOverlay" class="overlay"><div class="glass-card start-card"><div class="train-icon-header">🚇</div><h1 class="title">Midnight Express</h1><p class="subtitle">대한민국 전국 지하철역을 타이핑하며 떠나는 야간 여행</p><div class="control-hints"><div class="hint-item"><span class="key-badge">역 이름 입력</span><span>정확하게 입력하면 다음 역으로 이동합니다</span></div><div class="hint-item"><span class="key-badge">ENTER</span><span>정답 제출</span></div></div><div id="stationLoadStatus" class="music-status">전국 지하철역 데이터를 불러오는 중...</div><button id="btnStart" class="glow-btn" disabled><span class="btn-text">역 데이터를 불러오는 중...</span><span class="btn-subtext">잠시만 기다려주세요</span></button></div></div>
<header id="uiHeader" class="ui-layer"><div class="header-left"><div class="logo-group"><span class="logo-dot"></span><span class="logo-title">Midnight Express</span></div><div class="track-info"><span class="track-icon">🚇</span><span id="currentMelodyName" class="track-name">대한민국 지하철역 타자여행</span></div></div><div class="header-right"><button id="btnZenToggle" class="pill-btn"><span class="icon">📍</span><span id="zenText">전국 역</span></button></div></header>
<div id="typingGame" class="typing-game hidden"><div class="typing-card"><div id="stationRegion" class="station-region">대한민국 도시철도</div><div id="stationName" class="station-name">서울역</div><div id="stationHint" class="station-hint">역 이름을 그대로 입력하세요</div><input id="typingInput" class="typing-input" type="text" autocomplete="off" spellcheck="false" placeholder="역 이름 입력..."/><div class="typing-meta"><span id="comboText">0 COMBO</span><span id="progressText">0 / 0</span></div><div id="typingResult" class="typing-result"></div></div></div>
<div id="gameScoreContainer" class="ui-layer"><div id="comboDisplay" class="combo-box hidden"><span id="comboCount" class="combo-number">0</span><span class="combo-label">COMBO</span></div><div id="judgementText" class="judgement-text"></div></div></div>
<script src="js/audio.js"></script><script src="js/visuals.js"></script><script src="js/app.js"></script></body></html>
